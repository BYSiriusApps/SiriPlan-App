# Bağımlılık & güvenlik güncelleme otomasyonu — SEC-05
# Haftalık PR açar; sadece güvenlik/patch trafiğini düşük tutmak için
# minor+patch gruplanır, major ayrı PR olur (kırıcı değişiklik incelensin).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Next 16 bu projede özel — majör atlamalar elle yapılır (bkz. AGENTS.md).
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Istanbul"
    labels:
      - dependencies
      - ci
